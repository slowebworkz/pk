packages:
  - "packages/*"
  - "lib/*"
  - "adapters/*"
  - "examples/*"
  - "runtime/*"
  - "plugins/*"
  - "tooling/*"
  - "qa/*"
  - "spikes/*"
allowBuilds:
  "@ast-grep/cli": true
  esbuild: true
  unrs-resolver: true

catalog:
  # Core
  "@ast-grep/cli": ^0.45.0

  # Playwright
  "@axe-core/playwright": ^4.11.3
  "@eslint/js": ^10.0.0
  "@playwright/experimental-ct-react": ^1.62.1
  "@playwright/experimental-ct-vue": ^1.62.1
  "@playwright/test": ^1.62.1

  # Preact
  "@preact/preset-vite": ^2.10.6
  "@solidjs/testing-library": ^0.8.0
  "@sveltejs/vite-plugin-svelte": ^7.0.0
  "@testing-library/preact": ^3.2.0
  "@testing-library/svelte": ^5.0.0
  "@types/node": ^26.1.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@typescript-eslint/rule-tester": 8.68.0
  "@typescript-eslint/utils": 8.68.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitejs/plugin-vue": ^6.0.8
  "@vitest/ui": ^4.1.9
  "@vue/compiler-dom": ^3.5.41
  "@vue/server-renderer": ^3.5.41
  "@vue/test-utils": ^2.4.0
  class-variance-authority: ^0.7.1

  # Styling
  clsx: ^2.1.1
  dependency-cruiser: ^18.0.0
  eslint: ^10.8.1
  eslint-config-prettier: ^10.0.0
  eslint-plugin-boundaries: ^7.0.2
  eslint-plugin-import-x: ^4.16.2
  eslint-plugin-unicorn: ^73.0.0

  # Tooling
  husky: ^9.1.7

  jiti: ^2.7.0
  jscpd: ^4.2.4
  jsdom: ^29.0.0

  # Lit
  lit: ^3.0.0
  preact: ^10.29.8
  preact-render-to-string: ^6.5.0
  prettier: ^3.9.6

  # React
  react: ^19.2.8
  react-dom: ^19.2.8

  # Solid
  solid-js: ^1.9.0

  # Svelte
  svelte: ^5.56.10

  # Architecture tooling
  ts-morph: ^28.0.0
  tsdown: ^0.22.14
  tsup: ^8.5.1
  tsx: ^4.23.12
  type-fest: ^5.8.0
  typescript: ^6.0.3
  typescript-eslint: 8.68.0
  vite: ^8.2.1
  vite-plugin-solid: ^2.11.14
  vitest: ^4.1.10
  vue: ^3.5.41
overrides:
  # Floors for Dependabot security advisories (esbuild GHSA dev-server file
  # read; undici SOCKS5/Set-Cookie/cache advisories; @babel/core source-map
  # file read; brace-expansion GHSA-mh99-v99m-4gvg unbounded-expansion DoS;
  # postcss GHSA-fxqj-rqcc-2cmp sourceMappingURL arbitrary .map file read).
  # Keep >= the patched versions when bumping.
  "@babel/core": "^7.29.7"
  "brace-expansion": ">=5.0.8"
  esbuild: ">=0.28.1"
  postcss: ">=8.5.23"
  undici: "^7.29.0"

peerDependencyRules:
  allowedVersions:
    "@vitejs/plugin-react>vite": "8"
    "@vitejs/plugin-vue>vite": "8"
